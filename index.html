<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart AI Classroom — smarter teaching, personalized learning, better classrooms." />
  <title>Smart AI Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-shapes"></i></div>
        <div><strong>smartclass</strong><small>AI LEARNING PLATFORM</small></div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close navigation"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" id="mainNav">
        <button class="nav-item active" data-page="overview"><i class="fa-solid fa-grid-2"></i><span>Overview</span></button>
        <button class="nav-item" data-page="live"><i class="fa-solid fa-tower-broadcast"></i><span>Live Classroom</span><span class="live-dot"></span></button>
        <button class="nav-item" data-page="students"><i class="fa-solid fa-users"></i><span>Students</span></button>
        <button class="nav-item" data-page="adaptive"><i class="fa-solid fa-route"></i><span>Adaptive Learning</span></button>
        <button class="nav-item" data-page="analytics"><i class="fa-solid fa-chart-line"></i><span>Learning Analytics</span></button>
        <button class="nav-item" data-page="assignments"><i class="fa-solid fa-clipboard-list"></i><span>Assignments</span></button>
        <button class="nav-item" data-page="copilot"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI Co-Teacher</span><span class="nav-tag">AI</span></button>
        <button class="nav-item" data-page="attendance"><i class="fa-solid fa-calendar-check"></i><span>Smart Attendance</span></button>
        <button class="nav-item" data-page="timetable"><i class="fa-regular fa-calendar-days"></i><span>Class Timetable</span></button>
        <button class="nav-item" data-page="admin"><i class="fa-solid fa-building-columns"></i><span>Administration</span></button>
      </nav>
      <div class="workspace-label lower-label">PREFERENCES</div>
      <nav class="side-nav">
        <button class="nav-item" data-page="settings"><i class="fa-solid fa-sliders"></i><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="support-link" id="helpBtn"><i class="fa-regular fa-circle-question"></i> Help & Support</button>
        <div class="profile-mini">
          <div class="avatar avatar-teal">AM</div>
          <div class="profile-copy"><strong id="sideUserName">Aarav Mehta</strong><small id="sideUserRole">Teacher account</small></div>
          <button class="icon-btn" id="profileMenuBtn" aria-label="Profile menu"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
        <div class="profile-menu hidden" id="profileMenu">
          <button data-page="settings"><i class="fa-regular fa-user"></i> Profile settings</button>
          <button id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb"><span>Workspace</span><i class="fa-solid fa-chevron-right"></i><strong id="topPageTitle">Overview</strong></div>
        <div class="top-actions">
          <div class="global-search"><i class="fa-solid fa-magnifying-glass"></i><input id="globalSearch" type="search" placeholder="Search anything..." aria-label="Search" /><kbd>⌘ K</kbd></div>
          <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span></span></button>
          <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fa-regular fa-moon"></i></button>
          <div class="role-switch">
            <i class="fa-solid fa-user-gear"></i>
            <select id="roleSelect" aria-label="Switch role"><option value="teacher">Teacher</option><option value="student">Student</option><option value="admin">Admin</option></select>
          </div>
        </div>
      </header>

      <section class="page-content" id="pageContent" aria-live="polite"></section>
    </main>
  </div>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="toast-region" id="toastRegion"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">SMARTCLASS</p><h2 id="modalTitle">Modal title</h2></div><button class="icon-btn" id="modalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
